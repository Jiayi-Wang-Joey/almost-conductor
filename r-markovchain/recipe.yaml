context: {}

package:
  name: r-markovchain
  version: 0.10.0

source:
- url:
  - https://cran.r-project.org/src/contrib/markovchain_0.10.0.tar.gz
  - https://cran.r-project.org/src/contrib/Archive/markovchain_0.10.0.tar.gz
  sha256: fbd44f72b34795c2c5163662a57b6a7dca2c0b485de4538dda6b445153f33b53

build:
  script: R CMD INSTALL --build .

requirements:
  build:
  - ${{ compiler('c') }}
  - ${{ compiler('cxx') }}
  - make
  host:
  - r-base
  - r-base >=4.2.0
  - r-matrix >=1.5-0
  - r-rcpp
  - r-rcppparallel
  - r-rcpparmadillo >=0.9.600.4.0
  - r-igraph
  - r-expm
  - r-rcpp >=1.0.2
  run:
  - r-base
  - r-matrix >=1.5-0
  - r-igraph
  - r-expm
  - r-rcpp >=1.0.2
  - r-rcppparallel
  # -  r-knitr  # suggested
  # -  r-testthat  # suggested
  # -  r-diagram  # suggested
  # -  r-diagrammer  # suggested
  # -  r-msm  # suggested
  # -  r-rsolnp  # suggested
  # -  r-rmarkdown  # suggested
  # -  r-ctmcd  # suggested
  # -  r-bookdown  # suggested
  # -  r-rticles  # suggested

tests:
- script:
  - Rscript -e 'library("markovchain")'

about:
  homepage: https://github.com/spedygiorgio/markovchain/
  summary: Easy Handling Discrete Time Markov Chains
  description: |-
    Functions and S4 methods to create and manage discrete
    time Markov chains more easily. In addition functions to
    perform statistical (fitting and drawing random variates) and
    probabilistic (analysis of their structural proprieties)
    analysis are provided. See Spedicato (2017)
    <doi:10.32614/RJ-2017-036>. Some functions for continuous times
    Markov chains depend on the suggested ctmcd package.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/cran/markovchain

